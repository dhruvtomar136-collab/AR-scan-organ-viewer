<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>AI Odyssey AR</title>

  <!-- A-Frame -->
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>

  <!-- MindAR -->
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>

    body {
      margin: 0;
      overflow: hidden;
      font-family: Arial, sans-serif;
    }

    /* AI ODYSSEY TITLE */
    #title {
      position: fixed;
      top: 15px;
      left: 0;
      right: 0;

      text-align: center;

      color: white;
      font-size: 22px;
      font-weight: bold;

      z-index: 10;

      text-shadow:
        0 0 5px #00eaff,
        0 0 15px #008cff;

      pointer-events: none;
    }

    /* INSTRUCTION */
    #info {
      position: fixed;

      bottom: 20px;
      left: 50%;

      transform: translateX(-50%);

      background: rgba(0, 0, 0, 0.75);

      color: white;

      padding: 12px 20px;

      border-radius: 25px;

      font-size: 14px;

      z-index: 10;

      text-align: center;

      border: 1px solid #00d9ff;

      pointer-events: none;
    }

  </style>

</head>


<body>


<!-- HEADER -->

<div id="title">

  AI ODYSSEY • AR SCIENCE EXPLORER

</div>


<!-- INSTRUCTION -->

<div id="info">

  Scan the organ card to explore it in AR

</div>



<a-scene

  mindar-image="
    imageTargetSrc: ./targets%20%281%29.mind;
    autoStart: true;
    uiScanning: yes;
    uiLoading: yes;
  "

  embedded

  color-space="sRGB"

  renderer="
    colorManagement: true;
    physicallyCorrectLights
  "

  vr-mode-ui="enabled: false"

  device-orientation-permission-ui="enabled: false"
>



  <!-- CAMERA -->

  <a-camera

    position="0 0 0"

    look-controls="enabled: false">

  </a-camera>



  <!-- IMAGE TARGET -->

  <a-entity

    mindar-image-target="targetIndex: 0">



    <!-- HUMAN HEART -->

    <a-gltf-model

      src="./realistic_human_heart%284%29.glb"

      position="0 0 0"

      rotation="0 0 0"

      scale="0.5 0.5 0.5"

      animation="
        property: rotation;
        to: 0 360 0;
        dur: 10000;
        loop: true;
        easing: linear;
      ">

    </a-gltf-model>



  </a-entity>



  <!-- LIGHTING -->

  <a-light

    type="ambient"

    color="#ffffff"

    intensity="2">

  </a-light>



  <a-light

    type="directional"

    position="1 2 1"

    intensity="2">

  </a-light>



</a-scene>


</body>

</html>
