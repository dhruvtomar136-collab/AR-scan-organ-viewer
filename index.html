<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">

<title>AI Odyssey AR</title>

<script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

<style>

html,body{
margin:0;
padding:0;
width:100%;
height:100%;
overflow:hidden;
background:transparent;
font-family:Arial,sans-serif;
}

#loading{
position:fixed;
inset:0;
background:#07101d;
color:white;
display:flex;
align-items:center;
justify-content:center;
flex-direction:column;
z-index:9999;
font-size:18px;
}

#title{
position:fixed;
top:15px;
left:0;
right:0;
text-align:center;
color:white;
font-size:21px;
font-weight:bold;
z-index:9000;
text-shadow:0 0 10px #00d9ff;
pointer-events:none;
}

#hint{
position:fixed;
bottom:20px;
left:50%;
transform:translateX(-50%);
background:rgba(0,0,0,.75);
color:white;
padding:10px 16px;
border-radius:20px;
z-index:9000;
font-size:13px;
}

#popup{
display:none;
position:fixed;
left:50%;
bottom:65px;
transform:translateX(-50%);
width:320px;
max-width:85%;
background:rgba(5,10,20,.95);
color:white;
padding:18px;
border-radius:15px;
border:2px solid #00d9ff;
z-index:9998;
}

#popup h2{
margin:0 0 8px;
color:#00d9ff;
font-size:19px;
}

#popup p{
margin:0;
line-height:1.5;
font-size:14px;
}

#close{
position:absolute;
right:8px;
top:5px;
background:none;
border:0;
color:white;
font-size:20px;
}

</style>

</head>


<body>


<div id="loading">
Loading AI Odyssey AR...
<br>
<small>Allow camera access</small>
</div>


<div id="title">
AI ODYSSEY • AR SCIENCE EXPLORER
</div>


<div id="hint">
Point camera at the organ card
</div>


<a-scene

embedded

mindar-image="
imageTargetSrc: targets%20%281%29.mind;
autoStart: true;
uiScanning: yes;
uiLoading: yes;
"

renderer="
colorManagement: true;
alpha: true;
antialias: true;
"

vr-mode-ui="enabled:false"

device-orientation-permission-ui="enabled:false"
>


<a-assets>

<a-asset-item
id="heart"
src="realistic_human_heart%284%29.glb">
</a-asset-item>


<a-asset-item
id="brain"
src="low-poly_human_brain_model%281%29.glb">
</a-asset-item>


<a-asset-item
id="kidney"
src="human_kidney.glb">
</a-asset-item>

</a-assets>


<a-camera
position="0 0 0"
look-controls="enabled:false">
</a-camera>


<a-light
type="ambient"
intensity="2">
</a-light>


<a-light
type="directional"
position="2 4 3"
intensity="2">
</a-light>


<!-- =========================
     TARGET 0 = HEART
========================= -->

<a-entity
mindar-image-target="targetIndex:0"
id="heartTarget">


<a-entity
id="heartGroup"
position="0 0 0"
rotation="0 0 0"
scale="0.5 0.5 0.5">


<a-gltf-model
id="heartModel"
src="#heart"
class="clickable"
position="0 0 0"
rotation="0 0 0"
data-title="Human Heart"
data-info="The human heart is a muscular organ that pumps blood throughout the body. The right side receives deoxygenated blood and the left side pumps oxygenated blood.">
</a-gltf-model>


<a-sphere
class="clickable"
position="0.3 0.4 0.2"
radius="0.06"
color="#ff3355"
data-title="Right Atrium"
data-info="The right atrium receives deoxygenated blood returning from the body.">
</a-sphere>


<a-sphere
class="clickable"
position="-0.2 0.1 0.3"
radius="0.06"
color="#33aaff"
data-title="Left Ventricle"
data-info="The left ventricle pumps oxygenated blood to the body through the aorta.">
</a-sphere>


</a-entity>

</a-entity>


<!-- =========================
     TARGET 1 = BRAIN
========================= -->

<a-entity
mindar-image-target="targetIndex:1"
id="brainTarget">


<a-entity
id="brainGroup"
position="0 0 0"
rotation="0 0 0"
scale="0.5 0.5 0.5">


<a-gltf-model
id="brainModel"
src="#brain"
class="clickable"
position="0 0 0"
rotation="0 0 0"
data-title="Human Brain"
data-info="The human brain is the control center of the nervous system. It processes information, controls movement, and supports thought and memory.">
</a-gltf-model>


<a-sphere
class="clickable"
position="0 0.3 0.35"
radius="0.06"
color="#66ccff"
data-title="Frontal Lobe"
data-info="The frontal lobe is involved in reasoning, planning, problem solving and voluntary movement.">
</a-sphere>


<a-sphere
class="clickable"
position="0 -0.15 -0.35"
radius="0.06"
color="#88ff88"
data-title="Cerebellum"
data-info="The cerebellum helps coordinate balance, posture and smooth movement.">
</a-sphere>


<a-sphere
class="clickable"
position="0 -0.35 -0.05"
radius="0.06"
color="#ff9944"
data-title="Brainstem"
data-info="The brainstem connects the brain to the spinal cord and helps control important body functions.">
</a-sphere>


</a-entity>

</a-entity>


</a-scene>


<!-- INFORMATION -->

<div id="popup">

<button id="close">×</button>

<h2 id="popupTitle"></h2>

<p id="popupText"></p>

</div>


<script>

const scene=document.querySelector("a-scene");

const loading=document.getElementById("loading");

const popup=document.getElementById("popup");

const popupTitle=document.getElementById("popupTitle");

const popupText=document.getElementById("popupText");

const close=document.getElementById("close");

const heartGroup=document.getElementById("heartGroup");

const brainGroup=document.getElementById("brainGroup");

let activeGroup=null;

let activeTarget=null;

let rotating=false;

let lastX=0;

let lastY=0;


/* =========================
   SCENE READY
========================= */

scene.addEventListener("loaded",function(){

setTimeout(function(){

loading.style.display="none";

},1000);

});


/* =========================
   TARGET DETECTION
========================= */

document
.getElementById("heartTarget")
.addEventListener("targetFound",function(){

activeGroup=heartGroup;
activeTarget="heart";

});


document
.getElementById("brainTarget")
.addEventListener("targetFound",function(){

activeGroup=brainGroup;
activeTarget="brain";

});


document
.getElementById("heartTarget")
.addEventListener("targetLost",function(){

if(activeTarget==="heart"){
popup.style.display="none";
}

});


document
.getElementById("brainTarget")
.addEventListener("targetLost",function(){

if(activeTarget==="brain"){
popup.style.display="none";
}

});


/* =========================
   TAP INFORMATION
========================= */

document
.querySelectorAll(".clickable")
.forEach(function(element){

element.addEventListener("click",function(){

const title=
element.getAttribute("data-title");

const info=
element.getAttribute("data-info");

popupTitle.textContent=title;

popupText.textContent=info;

popup.style.display="block";

});

});


close.addEventListener("click",function(){

popup.style.display="none";

});


/* =========================
   TOUCH ROTATION
========================= */

scene.addEventListener("touchstart",function(e){

if(e.touches.length===1){

rotating=true;

lastX=e.touches[0].clientX;

lastY=e.touches[0].clientY;

}

},{passive:true});


scene.addEventListener("touchmove",function(e){

if(
rotating &&
e.touches.length===1 &&
activeGroup
){

const x=e.touches[0].clientX;

const y=e.touches[0].clientY;

const dx=x-lastX;

const dy=y-lastY;

let rotation=
activeGroup.getAttribute("rotation");

rotation.y += dx*0.7;

rotation.x -= dy*0.7;

rotation.x=
Math.max(-60,Math.min(60,rotation.x));

activeGroup.setAttribute(
"rotation",
rotation
);

lastX=x;

lastY=y;

}

},{passive:true});


scene.addEventListener("touchend",function(){

rotating=false;

},{passive:true});


/* =========================
   MOUSE ROTATION
========================= */

scene.addEventListener("mousedown",function(e){

if(activeGroup){

rotating=true;

lastX=e.clientX;

lastY=e.clientY;

}

});


scene.addEventListener("mousemove",function(e){

if(
rotating &&
activeGroup
){

const dx=e.clientX-lastX;

const dy=e.clientY-lastY;

let rotation=
activeGroup.getAttribute("rotation");

rotation.y += dx*0.7;

rotation.x -= dy*0.7;

rotation.x=
Math.max(-60,Math.min(60,rotation.x));

activeGroup.setAttribute(
"rotation",
rotation
);

lastX=e.clientX;

lastY=e.clientY;

}

});


window.addEventListener("mouseup",function(){

rotating=false;

});


/* =========================
   PINCH ZOOM
========================= */

let pinchStart=0;

let originalScale=0.5;


function getDistance(touches){

const dx=
touches[0].clientX-
touches[1].clientX;

const dy=
touches[0].clientY-
touches[1].clientY;

return Math.sqrt(dx*dx+dy*dy);

}


scene.addEventListener("touchstart",function(e){

if(
e.touches.length===2 &&
activeGroup
){

pinchStart=
getDistance(e.touches);

const scale=
activeGroup.getAttribute("scale");

originalScale=scale.x;

}

},{passive:true});


scene.addEventListener("touchmove",function(e){

if(
e.touches.length===2 &&
activeGroup &&
pinchStart
){

const distance=
getDistance(e.touches);

let scale=
originalScale*
(distance/pinchStart);

scale=
Math.max(
0.15,
Math.min(2.5,scale)
);

activeGroup.setAttribute(
"scale",
`${scale} ${scale} ${scale}`
);

}

},{passive:true});


scene.addEventListener("touchend",function(e){

if(e.touches.length<2){

pinchStart=0;

}

},{passive:true});


</script>

</body>
</html>
