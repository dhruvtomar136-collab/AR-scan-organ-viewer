<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>AR Human Heart, Brain & Kidney</title>

  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    * {
      box-sizing: border-box;
      touch-action: none;
    }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent;
      font-family: Arial, sans-serif;
    }

    video {
      position: fixed !important;
      inset: 0 !important;
      width: 100% !important;
      height: 100% !important;
      object-fit: cover !important;
      z-index: 0 !important;
    }

    a-scene {
      position: fixed !important;
      inset: 0 !important;
      width: 100% !important;
      height: 100% !important;
      background: transparent !important;
      z-index: 1 !important;
    }

    canvas {
      background: transparent !important;
    }

    #loading-screen {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      background: #0b0f14;
      color: white;
      z-index: 10000;
      transition: opacity .35s ease;
      padding: 24px;
    }

    #loading-screen.hidden {
      opacity: 0;
      pointer-events: none;
    }

    .spinner {
      width: 42px;
      height: 42px;
      border: 4px solid rgba(255,255,255,.2);
      border-top-color: #ff5566;
      border-radius: 50%;
      animation: spin .9s linear infinite;
      margin-bottom: 15px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    #loading-text {
      margin: 5px;
      font-size: 15px;
    }

    #loading-subtext {
      margin: 6px;
      font-size: 12px;
      opacity: .6;
    }

    #control-hint {
      position: fixed;
      top: 15px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0,0,0,.72);
      color: white;
      padding: 9px 15px;
      border-radius: 20px;
      font-size: 13px;
      z-index: 9000;
      opacity: 0;
      transition: opacity .3s ease;
      pointer-events: none;
      white-space: nowrap;
    }

    #control-hint.show {
      opacity: 1;
    }

    #models-badge {
      position: fixed;
      right: 14px;
      bottom: 18px;
      background: rgba(0,0,0,.65);
      color: white;
      padding: 6px 12px;
      border-radius: 14px;
      font-size: 11px;
      z-index: 9000;
      transition: opacity .35s ease;
    }

    #models-badge.hidden {
      opacity: 0;
      pointer-events: none;
    }

    #info-popup {
      display: none;
      position: fixed;
      left: 50%;
      bottom: 22px;
      transform: translateX(-50%) translateY(10px);
      width: 350px;
      max-width: 88%;
      padding: 18px 45px 18px 18px;
      background: rgba(15,18,22,.95);
      color: white;
      border-radius: 15px;
      border-left: 4px solid #ff5566;
      box-shadow: 0 8px 25px rgba(0,0,0,.5);
      z-index: 9999;
      opacity: 0;
      transition: opacity .25s ease, transform .25s ease;
    }

    #info-popup.visible {
      display: block;
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    #info-title {
      margin: 0 0 7px;
      color: #ff6677;
      font-size: 18px;
      font-weight: bold;
    }

    #info-text {
      margin: 0;
      font-size: 15px;
      line-height: 1.5;
    }

    #close-popup {
      position: absolute;
      top: 8px;
      right: 10px;
      border: 0;
      background: none;
      color: white;
      font-size: 21px;
      cursor: pointer;
    }
  </style>
</head>

<body>
  <div id="loading-screen">
    <div class="spinner"></div>
    <p id="loading-text">Starting AR camera…</p>
    <p id="loading-subtext">Allow camera access, then point at a target image.</p>
  </div>

  <div id="control-hint">Drag = Rotate • Pinch = Zoom • Tap = Learn</div>
  <div id="models-badge">Loading 3D organs…</div>

  <a-scene
    mindar-image="
      imageTargetSrc: ./targets%20%281%29.mind?v=5;
      autoStart: true;
      uiScanning: yes;
      uiLoading: no;
    "
    color-space="sRGB"
    renderer="alpha: true; colorManagement: true; antialias: true;"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false"
    embedded
  >

    <a-assets timeout="30000">
      <a-asset-item id="heartModel" src="./realistic_human_heart%284%29.glb"></a-asset-item>
      <a-asset-item id="brainModel" src="./low-poly_human_brain_model%281%29.glb"></a-asset-item>
      <a-asset-item id="kidneyModel" src="./human_kidney.glb"></a-asset-item>
    </a-assets>

    <a-camera
      position="0 0 0"
      look-controls="enabled: false"
      cursor="rayOrigin: mouse; fuse: false"
      raycaster="objects: .clickable; far: 20;"
    ></a-camera>

    <a-light type="ambient" intensity="2"></a-light>
    <a-light type="directional" intensity="2" position="2 4 3"></a-light>
    <a-light type="directional" intensity="1.5" position="-3 2 1"></a-light>

    <!-- IMPORTANT:
         These targetIndex values must match the order inside targets (1).mind:
         0 = Kidney, 1 = Brain, 2 = Heart.
         If your .mind file was generated in a different order, change ONLY these numbers.
    -->

    <!-- HEART -->
    <a-entity id="target-heart" mindar-image-target="targetIndex: 2">
      <a-entity id="heart-wrapper" class="organ-wrapper"
                position="0 0 0" rotation="0 0 0" scale="0.5 0.5 0.5">

        <a-gltf-model
          id="heart-model"
          class="clickable main-model"
          src="#heartModel"
          position="0 0 0"
          rotation="0 0 0"
          visible="true"
          data-title="❤️ Human Heart"
          data-info="The human heart is a muscular organ that pumps blood throughout the body. The right side receives deoxygenated blood, while the left side pumps oxygenated blood to the body."
        ></a-gltf-model>

        <a-sphere class="clickable hotspot"
          data-title="Right Atrium"
          data-info="The right atrium receives deoxygenated blood returning from the body through the vena cava."
          position="0.3 0.4 0.2" radius="0.05"
          material="color:#ff5566; opacity:0.85; transparent:true; shader:flat;">
        </a-sphere>

        <a-sphere class="clickable hotspot"
          data-title="Left Ventricle"
          data-info="The left ventricle pumps oxygenated blood out to the body through the aorta."
          position="-0.2 0.1 0.3" radius="0.05"
          material="color:#33aaff; opacity:0.85; transparent:true; shader:flat;">
        </a-sphere>

        <a-sphere class="clickable hotspot"
          data-title="Aortic Valve"
          data-info="The aortic valve helps prevent blood from flowing backward into the left ventricle."
          position="0 0.5 0" radius="0.05"
          material="color:#ffcc00; opacity:0.85; transparent:true; shader:flat;">
        </a-sphere>
      </a-entity>
    </a-entity>

    <!-- BRAIN -->
    <a-entity id="target-brain" mindar-image-target="targetIndex: 1">
      <a-entity id="brain-wrapper" class="organ-wrapper"
                position="0 0 0" rotation="0 0 0" scale="0.5 0.5 0.5">

        <a-gltf-model
          id="brain-model"
          class="clickable main-model"
          src="#brainModel"
          position="0 0 0"
          rotation="0 0 0"
          visible="true"
          data-title="🧠 Human Brain"
          data-info="The human brain is the control center of the nervous system. It processes sensory information, coordinates movement, and supports thought, memory, and emotion."
        ></a-gltf-model>

        <a-sphere class="clickable hotspot"
          data-title="Frontal Lobe"
          data-info="The frontal lobe is involved in reasoning, planning, problem-solving, voluntary movement, and aspects of speech."
          position="0 0.3 0.35" radius="0.05"
          material="color:#66ccff; opacity:0.85; transparent:true; shader:flat;">
        </a-sphere>

        <a-sphere class="clickable hotspot"
          data-title="Cerebellum"
          data-info="The cerebellum helps coordinate balance, posture, and smooth voluntary movement."
          position="0 -0.15 -0.35" radius="0.05"
          material="color:#88ff88; opacity:0.85; transparent:true; shader:flat;">
        </a-sphere>

        <a-sphere class="clickable hotspot"
          data-title="Brainstem"
          data-info="The brainstem connects the brain with the spinal cord and helps control essential functions such as breathing and heart rate."
          position="0 -0.35 -0.05" radius="0.05"
          material="color:#ff9944; opacity:0.85; transparent:true; shader:flat;">
        </a-sphere>
      </a-entity>
    </a-entity>

    <!-- KIDNEY -->
    <a-entity id="target-kidney" mindar-image-target="targetIndex: 0">
      <a-entity id="kidney-wrapper" class="organ-wrapper"
                position="0 0 0" rotation="0 0 0" scale="0.5 0.5 0.5">

        <a-gltf-model
          id="kidney-model"
          class="clickable main-model"
          src="#kidneyModel"
          position="0 0 0"
          rotation="0 0 0"
          visible="true"
          data-title="🫘 Human Kidney"
          data-info="The kidneys filter waste and excess fluid from the blood, produce urine, and help regulate fluid balance, electrolytes, blood pressure, and red blood cell production."
        ></a-gltf-model>

        <a-sphere class="clickable hotspot"
          data-title="Renal Cortex"
          data-info="The renal cortex is the outer region of the kidney and contains structures where blood filtration begins."
          position="0.2 0.3 0.2" radius="0.05"
          material="color:#66ccff; opacity:0.85; transparent:true; shader:flat;">
        </a-sphere>

        <a-sphere class="clickable hotspot"
          data-title="Renal Pelvis"
          data-info="The renal pelvis collects urine before it passes through the ureter toward the bladder."
          position="-0.15 -0.1 0.1" radius="0.05"
          material="color:#ffaa33; opacity:0.85; transparent:true; shader:flat;">
        </a-sphere>
      </a-entity>
    </a-entity>

  </a-scene>

  <div id="info-popup">
    <button id="close-popup" aria-label="Close">✕</button>
    <h2 id="info-title">Human Organ</h2>
    <p id="info-text"></p>
  </div>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const scene = document.querySelector("a-scene");
      const loading = document.getElementById("loading-screen");
      const loadingText = document.getElementById("loading-text");
      const modelsBadge = document.getElementById("models-badge");
      const hint = document.getElementById("control-hint");

      const popup = document.getElementById("info-popup");
      const title = document.getElementById("info-title");
      const text = document.getElementById("info-text");
      const close = document.getElementById("close-popup");

      const wrappers = {
        heart: document.getElementById("heart-wrapper"),
        brain: document.getElementById("brain-wrapper"),
        kidney: document.getElementById("kidney-wrapper")
      };

      const states = {
        heart:  { rotateX: 0, rotateY: 0, scale: 0.5 },
        brain:  { rotateX: 0, rotateY: 0, scale: 0.5 },
        kidney: { rotateX: 0, rotateY: 0, scale: 0.5 }
      };

      let activeKey = null;
      let dragging = false;
      let startX = 0;
      let startY = 0;
      let moved = false;
      let pinchStart = null;
      let pinchBaseScale = 0.5;

      function hideLoading(message) {
        if (message) loadingText.textContent = message;
        loading.classList.add("hidden");
        setTimeout(() => {
          loading.style.display = "none";
        }, 400);
      }

      function showHint() {
        hint.classList.add("show");
        clearTimeout(showHint.timer);
        showHint.timer = setTimeout(() => hint.classList.remove("show"), 4000);
      }

      function closePopup() {
        popup.classList.remove("visible");
      }

      function setTransform(key) {
        const state = states[key];
        wrappers[key].setAttribute(
          "rotation",
          `${state.rotateX} ${state.rotateY} 0`
        );
        wrappers[key].setAttribute(
          "scale",
          `${state.scale} ${state.scale} ${state.scale}`
        );
      }

      function setActive(key) {
        activeKey = key;
        showHint();
      }

      function clearActive(key) {
        if (activeKey === key) {
          activeKey = null;
          closePopup();
        }
      }

      // MindAR lifecycle
      scene.addEventListener("arReady", () => {
        hideLoading("Camera ready — scan a target image");
      });

      scene.addEventListener("arError", (event) => {
        console.error("MindAR error:", event);
        loadingText.textContent =
          "AR could not start. Check camera permission and reload the page.";
      });

      scene.addEventListener("loaded", () => {
        modelsBadge.textContent = "3D organs ready";
        setTimeout(() => modelsBadge.classList.add("hidden"), 1200);
      });

      // Target events
      document.getElementById("target-heart")
        .addEventListener("targetFound", () => setActive("heart"));

      document.getElementById("target-heart")
        .addEventListener("targetLost", () => clearActive("heart"));

      document.getElementById("target-brain")
        .addEventListener("targetFound", () => setActive("brain"));

      document.getElementById("target-brain")
        .addEventListener("targetLost", () => clearActive("brain"));

      document.getElementById("target-kidney")
        .addEventListener("targetFound", () => setActive("kidney"));

      document.getElementById("target-kidney")
        .addEventListener("targetLost", () => clearActive("kidney"));

      // Model/hotspot information
      document.querySelectorAll(".main-model, .hotspot").forEach((el) => {
        el.addEventListener("click", (event) => {
          event.stopPropagation();

          const dataTitle = el.getAttribute("data-title");
          const dataInfo = el.getAttribute("data-info");

          if (!dataTitle || !dataInfo) return;

          title.textContent = dataTitle;
          text.textContent = dataInfo;
          popup.classList.add("visible");
        });
      });

      close.addEventListener("click", closePopup);

      // Touch controls
      scene.addEventListener("touchstart", (event) => {
        if (!activeKey) return;

        if (event.touches.length === 2) {
          dragging = false;
          pinchStart = distance(event.touches);
          pinchBaseScale = states[activeKey].scale;
          return;
        }

        if (event.touches.length === 1) {
          dragging = true;
          moved = false;
          startX = event.touches[0].clientX;
          startY = event.touches[0].clientY;
        }
      }, { passive: true });

      scene.addEventListener("touchmove", (event) => {
        if (!activeKey) return;

        if (event.touches.length === 2 && pinchStart) {
          const ratio = distance(event.touches) / pinchStart;
          const state = states[activeKey];

          state.scale = clamp(
            pinchBaseScale * ratio,
            0.15,
            2.5
          );

          setTransform(activeKey);
          return;
        }

        if (
          dragging &&
          event.touches.length === 1
        ) {
          const x = event.touches[0].clientX;
          const y = event.touches[0].clientY;
          const dx = x - startX;
          const dy = y - startY;

          if (Math.abs(dx) + Math.abs(dy) > 5) moved = true;

          const state = states[activeKey];
          state.rotateY += dx * 0.6;
          state.rotateX = clamp(state.rotateX - dy * 0.6, -60, 60);

          setTransform(activeKey);

          startX = x;
          startY = y;
        }
      }, { passive: true });

      scene.addEventListener("touchend", (event) => {
        if (event.touches.length < 2) pinchStart = null;
        if (event.touches.length === 0) dragging = false;
      }, { passive: true });

      // Desktop mouse controls
      scene.addEventListener("mousedown", (event) => {
        if (!activeKey) return;
        dragging = true;
        moved = false;
        startX = event.clientX;
        startY = event.clientY;
      });

      scene.addEventListener("mousemove", (event) => {
        if (!dragging || !activeKey) return;

        const dx = event.clientX - startX;
        const dy = event.clientY - startY;

        if (Math.abs(dx) + Math.abs(dy) > 5) moved = true;

        const state = states[activeKey];
        state.rotateY += dx * 0.6;
        state.rotateX = clamp(state.rotateX - dy * 0.6, -60, 60);

        setTransform(activeKey);

        startX = event.clientX;
        startY = event.clientY;
      });

      window.addEventListener("mouseup", () => {
        dragging = false;
      });

      scene.addEventListener("wheel", (event) => {
        if (!activeKey) return;

        event.preventDefault();

        const state = states[activeKey];
        const factor = event.deltaY > 0 ? 0.95 : 1.05;

        state.scale = clamp(state.scale * factor, 0.15, 2.5);
        setTransform(activeKey);
      }, { passive: false });

      function distance(touches) {
        const dx = touches[0].clientX - touches[1].clientX;
        const dy = touches[0].clientY - touches[1].clientY;
        return Math.sqrt(dx * dx + dy * dy);
      }

      function clamp(value, min, max) {
        return Math.max(min, Math.min(max, value));
      }

      // Fallback status messages
      setTimeout(() => {
        if (loading.style.display !== "none") {
          loadingText.textContent =
            "Still starting camera… check that camera permission is allowed.";
        }
      }, 7000);

      setTimeout(() => {
        if (loading.style.display !== "none") {
          loadingText.textContent =
            "If the camera does not appear, reload and allow camera access.";
        }
      }, 16000);
    });
  </script>
</body>
</html>
